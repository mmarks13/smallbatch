# Compile a smallbatch function on the cheapest available cloud GPU.
#
#   pip install skypilot[aws,gcp,azure]   # pick your clouds
#   sky launch -c sb cloud/skypilot.yaml --env SPEC=examples/ticket-priority/spec.yaml
#   rsync -av sb:~/sky_workdir/artifacts/ artifacts/
#   sky down sb
#
# Labeling happens locally (it needs your teacher credentials); only the
# GPU-bound compile step ships to the cloud, so `data/` must exist first.
# Note: any `spec_files` your spec references must live inside the workdir
# (or be mirrored with file_mounts) so they exist on the remote host.

resources:
  accelerators: { L4: 1 }   # any modern GPU works; L4 spot is usually cheapest
  use_spot: true

workdir: .

envs:
  SPEC: examples/ticket-priority/spec.yaml

setup: |
  pip install -e .

run: |
  smallbatch compile ${SPEC}
