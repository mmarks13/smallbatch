[project]
name = "smallbatch"
version = "0.2.0"
description = "Distill prompt-driven LLM decisions into tested local CPU functions."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Michael Marks" }]
keywords = ["distillation", "classification", "setfit", "lora", "local-inference", "cpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    # Pascal cards need a <2.7/cu124 build (see docs/local-gpu.md);
    # Blackwell (RTX 50xx) needs >=2.7/cu128 — so no upper bound here
    "torch>=2.4",
    # SetFit 1.1.3 imports Transformers 4.x APIs removed in 5.x
    "transformers>=4.56,<5",
    "peft>=0.14",
    "trl>=0.13",
    "datasets>=2.19",
    "accelerate>=0.30",
    # the conventional tfidf candidate (torch-free path)
    "scikit-learn>=1.4",
    "skops>=0.10",
    # intermediary few-shot sentence-transformer candidate
    "setfit>=1.1.3,<1.2",
    "sentence-transformers>=3,<6",
]

[project.optional-dependencies]
qlora = ["bitsandbytes>=0.46.1"]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/mmarks13/smallbatch"
Repository = "https://github.com/mmarks13/smallbatch"
Issues = "https://github.com/mmarks13/smallbatch/issues"

[project.scripts]
smallbatch = "smallbatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["assets/"]

[tool.hatch.build.targets.wheel]
packages = ["src/smallbatch"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "A"]
ignore = [
    "E501",  # long lines: prose-heavy strings/comments; length is advisory here
    "A001",  # `compile` is the deliberate product verb (smallbatch.compile)
    "A002",  # ...and appears as a parameter name in its CLI plumbing
    "B023",  # closure-over-loop-var: reviewed case-by-case, noqa'd where real
    "B905",  # zip strict=: aligned-list zips are pervasive and length-checked upstream
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]  # tests bind small lambdas for brevity
