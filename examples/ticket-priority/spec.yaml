# A minimal, self-contained smallbatch function: classify a support ticket's
# priority. Run it end-to-end with the bundled items.json — see README.md in
# this directory.
name: ticket-priority
description: >
  Assign a triage priority to an inbound customer support ticket for a small
  B2B SaaS product (a web dashboard with an API, billing, and integrations).
input_schema: # fields serialized into the prompt, in this order
  subject: str
  body: str
  product_area: str
  customer_tier: str
output:
  type: enum
  labels: [urgent, normal, low]
rubric: |
  urgent — the customer is blocked from doing their job right now, or damage
  is ongoing: production outage or errors for all/most of their users, data
  loss or corruption, a security concern, failed payment runs on live
  invoices, or an enterprise customer hard-blocked during a launch.
  normal — something is wrong or confusing but there is a workaround or the
  impact is contained: a bug affecting some users or one feature, degraded
  performance, an integration failing intermittently, billing questions with
  a real deadline, or setup problems blocking a rollout that hasn't started.
  low — nothing is broken: feature requests, cosmetic issues, documentation
  gaps, questions answerable from docs, or "nice to have" configuration asks.
  When torn between two labels, ask: "if this waits until tomorrow, does the
  customer lose money or data?" Yes → urgent. "Is the customer currently
  unable to complete a task with no workaround?" Yes → at least normal.
teacher:
  # Any /chat/completions endpoint works. This default targets a local Ollama
  # server so the example runs with no API key; swap base_url/model/api_key_env
  # for a hosted provider you are authorized to use (docs/responsible-use.md).
  backend: openai-compatible
  base_url: http://localhost:11434/v1
  model: qwen3:8b
  examples: 150 # augment the ~70 real items with teacher-generated variants
  holdout: 0.15
gate:
  agreement_pm1: 0.85 # exact-match fraction for enum outputs
  must_beat_zeroshot: true
train:
  # any open-weights causal LM works here; your adapter inherits the base
  # model's license (LFM Open License conditions commercial use above $10M
  # revenue — swap the base if that matters for you)
  base: LiquidAI/LFM2.5-350M-Base
  precision: auto # fp32 on pre-Ampere, bf16 on Ampere+; qlora for bigger bases
