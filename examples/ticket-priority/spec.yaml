name: ticket-priority
description: Assign a triage priority to an inbound B2B SaaS support ticket.
input_schema:
  subject: string
  body: string
  product_area: string
  customer_tier: string
output:
  type: enum
  labels: [urgent, normal, low]
prompt: |
  Choose exactly one priority.

  urgent: The customer is blocked now or damage is ongoing, including a
  production outage, widespread errors, data loss or corruption, a security
  concern, failed live payment runs, or a launch-blocking enterprise failure.

  normal: Something is wrong or confusing but impact is contained or a
  workaround exists, including a limited bug, degraded performance,
  intermittent integration failure, time-sensitive billing issue, or setup
  problem blocking a rollout that has not started.

  low: Nothing is broken, including feature requests, cosmetic issues,
  documentation gaps, general questions, and optional configuration changes.

  If waiting until tomorrow risks money or data, choose urgent. If a current
  task has no workaround, choose at least normal. Otherwise choose low.
teacher:
  backend: openai-compatible
  base_url: http://localhost:11434/v1
  model: qwen3:8b
candidates:
  tfidf:
    type: tfidf
  bge-small:
    type: setfit
    model: BAAI/bge-small-en-v1.5
  granite-350m:
    type: lora
    model: ibm-granite/granite-4.0-350m
    precision: auto
