name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # the release workflow reuses these operational checks

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The normal suite is CPU-only and offline after installation.
      - name: Install
        run: |
          python -m pip install -U pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests case-study
      - name: Unit tests (CPU-only, no network)
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Wheel smoke (CLI + compile + standalone function wheel)
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install -q dist/*.whl --extra-index-url https://download.pytorch.org/whl/cpu
          /tmp/smoke/bin/smallbatch --help
          /tmp/smoke/bin/smallbatch init classifier smoke-fn --dir /tmp/smoke-fn
          /tmp/smoke/bin/python - <<'PY'
          import importlib.metadata
          import smallbatch
          assert importlib.metadata.version("smallbatch") == smallbatch.__version__
          import json, zipfile
          from pathlib import Path
          from smallbatch.api import compile, label, select
          from smallbatch.spec import FunctionSpec
          spec = FunctionSpec(
              name="smoke", input_schema={"text": "string"},
              output={"type": "enum", "labels": ["a", "b"]},
              prompt="a for fruit, b for bread",
              candidates={"tfidf": {"type": "tfidf"}},
          )
          items = [
              {"input": {"text": f"apple fruit {i}"}, "output": "a"} if i % 2 == 0
              else {"input": {"text": f"bread loaf {i}"}, "output": "b"}
              for i in range(30)
          ]
          label(spec, items, out_dir="/tmp/smoke-data")
          built = compile(spec, data_dir="/tmp/smoke-data", artifacts_root="/tmp/smoke-artifacts", cpu_threads=1)
          selected = select("smoke", "tfidf", version=built.build_id, artifacts_root="/tmp/smoke-artifacts", interactive=False)
          with zipfile.ZipFile(selected.wheel) as archive:
              metadata = archive.read(next(n for n in archive.namelist() if n.endswith(".dist-info/METADATA"))).decode()
              assert "Requires-Dist: smallbatch\n" not in metadata
          print("smallbatch and standalone wheel smoke ok")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
