name: release

# PyPI trusted publishing: fires on a version tag, but only after the full
# test + build + wheel-smoke checks pass. The `pypi` environment should
# be protected in the repo settings (required reviewers optional).
on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  gpu-gate:
    # a release must be preceded by a manually dispatched gpu-release run on
    # this exact commit; tagging alone is not enough. Deliberately manual so
    # the 45-minute matrix runs once per release candidate, not per push.
    # The cloud matrix (docs/cloud.md, RunPod) is also on the release
    # checklist but is verified by hand until its API key is sorted.
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require a successful gpu-release run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/gpu-release.yml/runs?head_sha=${GITHUB_SHA}&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | sort_by(.run_number) | last | .id // empty')
          if [ -z "${run_id}" ]; then
            echo "No successful gpu-release run found for ${GITHUB_SHA}."
            echo "Dispatch the gpu-release workflow on this commit, let it"
            echo "pass, then re-push the tag."
            exit 1
          fi
          passed_job=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
            --jq '[.jobs[] | select(.name == "gpu-release" and .conclusion == "success")] | length')
          if [ "${passed_job}" -lt 1 ]; then
            echo "gpu-release run ${run_id} did not contain a successful gpu-release job."
            echo "Skipped jobs do not satisfy the release gate."
            exit 1
          fi

  publish:
    needs: [test, gpu-gate]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing; nothing else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Check tag matches package version
        run: |
          pkg=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          test "$pkg" = "$tag" || { echo "tag v$tag != pyproject $pkg"; exit 1; }
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
